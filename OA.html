<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <link rel="icon" type="image/png" href="NAP-PRO9.png">
    <link rel="apple-touch-icon" href="NAP-PRO9.png">
    
    <title>Calendar of Activities - Monitoring Portal</title>
    
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            font-family: 'Montserrat', sans-serif; 
            background-color: #e5e5e5; 
            -webkit-text-size-adjust: 100%;
        }
        
        .main-container { 
            height: 100vh; 
            height: 100dvh; /* Dynamic viewport height for modern mobile browsers & iOS */
            width: 100vw;
            position: relative; 
        }
        
        /* Floating Action Buttons Container */
        .controls-container {
            position: absolute;
            top: env(safe-area-inset-top, 15px);
            right: 15px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }

        /* Floating Buttons Style */
        .floating-btn {
            cursor: pointer;
            background: rgba(26, 37, 47, 0.85);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: background 0.3s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .floating-btn:hover { background: #e67e22; }

        .sheet-container { 
            height: 100%; 
            width: 100%; 
        }
        
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block; 
            -webkit-overflow-scrolling: touch; 
        }
    </style>
</head>
<body>

    <div class="main-container" id="fullscreen-target">
        <!-- Action Buttons (Open in New Tab & Fullscreen Toggle) -->
        <div class="controls-container">
            <a href="https://script.google.com/macros/s/AKfycbz4aPCijq1ke_xNN1hr35SpJFVcPmoDh1p77SB4L1hhV5YWf36zHXksU3M1127-sOIc/exec?page=calendar" 
               target="_blank" 
               class="floating-btn" 
               title="Open Calendar in Full View">↗</a>
            <button class="floating-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">⛶</button>
        </div>

        <div class="sheet-container">
            <iframe 
                src="https://script.google.com/macros/s/AKfycbz4aPCijq1ke_xNN1hr35SpJFVcPmoDh1p77SB4L1hhV5YWf36zHXksU3M1127-sOIc/exec?page=calendar"
                allow="fullscreen; accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <script>
        function triggerAutoFullscreen() {
            const elem = document.getElementById("fullscreen-target");
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {});
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            }
            window.removeEventListener('click', triggerAutoFullscreen);
            window.removeEventListener('touchend', triggerAutoFullscreen);
        }

        window.addEventListener('click', triggerAutoFullscreen);
        window.addEventListener('touchend', triggerAutoFullscreen);

        function toggleFullscreen() {
            const elem = document.getElementById("fullscreen-target");
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;

            if (!isFullscreen) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => alert(`Error: ${err.message}`));
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
