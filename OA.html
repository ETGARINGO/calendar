<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Calendar of Activities - Monitoring Portal</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #eef2f6;

    -webkit-text-size-adjust: 100%;
}


/* =========================================================
   MAIN APPLICATION
========================================================= */

.app {

    width: 100%;
    height: 100dvh;
    min-height: 100vh;

    display: flex;
    flex-direction: column;

    background: #ffffff;

}


/* =========================================================
   HEADER
========================================================= */

.header {

    width: 100%;
    height: 70px;
    min-height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding:
        8px 16px;

    background:
        linear-gradient(
            135deg,
            #102a43,
            #174a78
        );

    color: #ffffff;

    box-shadow:
        0 2px 10px rgba(0,0,0,.25);

    position: relative;

    z-index: 100;

}


/* =========================================================
   BRAND
========================================================= */

.brand {

    display: flex;
    align-items: center;

    gap: 12px;

    min-width: 0;

}


/* =========================================================
   CALENDAR LOGO
========================================================= */

.calendar-logo {

    width: 50px;
    height: 50px;

    flex-shrink: 0;

    position: relative;

    border-radius: 9px;

    background: #ffffff;

    box-shadow:
        0 3px 8px rgba(0,0,0,.30);

    overflow: hidden;

}


/* Calendar top bar */

.calendar-logo::before {

    content: "";

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 14px;

    background: #d64545;

}


/* Calendar binding rings */

.calendar-logo::after {

    content: "••";

    position: absolute;

    left: 0;
    right: 0;
    top: 1px;

    text-align: center;

    color: #ffffff;

    font-size: 13px;

    letter-spacing: 17px;

}


/* =========================================================
   CALENDAR LOGO CONTENT
========================================================= */

.calendar-logo-content {

    position: absolute;

    left: 5px;
    right: 5px;

    top: 18px;
    bottom: 5px;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    grid-template-rows:
        repeat(2, 1fr);

    gap: 3px;

}


/* Calendar squares */

.calendar-square {

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 2px;

    background: #e9f0f7;

    color: #173f67;

    font-size: 7px;

    font-weight: 800;

}


/* Highlight */

.calendar-square.active {

    background: #173f67;

    color: #ffffff;

}


/* =========================================================
   BRAND TEXT
========================================================= */

.brand-text {

    min-width: 0;

}


.brand-title {

    font-size: 17px;

    font-weight: 800;

    line-height: 1.1;

    letter-spacing: .2px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


.brand-subtitle {

    margin-top: 5px;

    font-size: 11px;

    opacity: .78;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* =========================================================
   ACTION BUTTONS
========================================================= */

.header-actions {

    display: flex;

    align-items: center;

    gap: 7px;

    flex-shrink: 0;

}


.header-btn {

    height: 40px;

    min-width: 40px;

    padding:
        0 12px;

    border: none;

    border-radius: 6px;

    background:
        rgba(255,255,255,.12);

    color: #ffffff;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 12px;

    font-weight: 700;

    transition:
        background .2s ease,
        transform .2s ease;

}


.header-btn:hover {

    background: #e67e22;

}


.header-btn:active {

    transform:
        scale(.95);

}


.icon {

    font-size: 19px;

    line-height: 1;

}


.button-text {

    margin-left: 6px;

}


/* =========================================================
   CALENDAR CONTENT
========================================================= */

.calendar-container {

    position: relative;

    flex: 1;

    width: 100%;

    min-height: 0;

    background: #f4f6f8;

}


/* =========================================================
   MAIN CALENDAR
========================================================= */

#calendarFrame {

    width: 100%;
    height: 100%;

    display: block;

    border: none;

    background: #ffffff;

}


/* =========================================================
   LOADING SCREEN
========================================================= */

.loading {

    position: absolute;

    inset: 0;

    z-index: 20;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background: #f4f6f8;

    color: #173f67;

    transition:
        opacity .3s ease;

}


.loading.hidden {

    opacity: 0;

    pointer-events: none;

}


/* Loading calendar logo */

.loading-calendar-logo {

    width: 75px;

    height: 75px;

    position: relative;

    border-radius: 12px;

    background: #ffffff;

    box-shadow:
        0 4px 15px rgba(0,0,0,.15);

    overflow: hidden;

    margin-bottom: 17px;

}


.loading-calendar-logo-top {

    height: 20px;

    width: 100%;

    background: #d64545;

}


.loading-calendar-grid {

    position: absolute;

    left: 9px;
    right: 9px;
    top: 29px;
    bottom: 9px;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    grid-template-rows:
        repeat(2, 1fr);

    gap: 5px;

}


.loading-calendar-cell {

    background: #e7edf4;

    border-radius: 3px;

}


.loading-title {

    font-size: 16px;

    font-weight: 800;

}


.loading-text {

    margin-top: 5px;

    font-size: 12px;

    color: #667085;

}


.spinner {

    width: 30px;

    height: 30px;

    margin-top: 17px;

    border:
        3px solid #dce3ea;

    border-top-color:
        #173f67;

    border-radius: 50%;

    animation:
        spin .8s linear infinite;

}


@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =========================================================
   FULLSCREEN
========================================================= */

.app:fullscreen .header {

    display: none;

}


.app:-webkit-full-screen .header {

    display: none;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .header {

        height: 60px;

        min-height: 60px;

        padding:
            6px 10px;

    }


    .calendar-logo {

        width: 43px;

        height: 43px;

    }


    .calendar-logo::before {

        height: 12px;

    }


    .calendar-logo-content {

        top: 16px;

    }


    .brand {

        gap: 9px;

    }


    .brand-title {

        font-size: 13px;

    }


    .brand-subtitle {

        font-size: 9px;

        margin-top: 3px;

    }


    .header-btn {

        width: 38px;

        min-width: 38px;

        height: 38px;

        padding: 0;

    }


    .button-text {

        display: none;

    }


    .icon {

        font-size: 18px;

    }

}


/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media (max-width: 380px) {

    .brand-subtitle {

        display: none;

    }


    .brand-title {

        font-size: 12px;

    }


    .calendar-logo {

        width: 40px;

        height: 40px;

    }

}

</style>

</head>


<body>


<div class="app" id="app">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">


        <!-- =================================================
             CALENDAR LOGO

             This is a REAL HTML/CSS logo.

             It does NOT contain:
             - iframe
             - src URL
             - external image
             - clickable link
        ================================================== -->

        <div class="brand">


            <div
                class="calendar-logo"
                aria-label="Calendar of Activities"
            >

                <div class="calendar-logo-content">

                    <div class="calendar-square">
                        1
                    </div>

                    <div class="calendar-square">
                        2
                    </div>

                    <div class="calendar-square active">
                        3
                    </div>

                    <div class="calendar-square">
                        4
                    </div>

                    <div class="calendar-square">
                        5
                    </div>

                    <div class="calendar-square">
                        6
                    </div>

                </div>

            </div>


            <div class="brand-text">

                <div class="brand-title">

                    CALENDAR OF ACTIVITIES

                </div>


                <div class="brand-subtitle">

                    Records Management Monitoring Portal

                </div>

            </div>


        </div>


        <!-- =================================================
             ACTIONS
        ================================================== -->

        <div class="header-actions">


            <!-- FULLSCREEN ONLY -->

            <button
                class="header-btn"
                onclick="toggleFullscreen()"
                title="Fullscreen"
                aria-label="Fullscreen"
            >

                <span
                    class="icon"
                    id="fullscreenIcon"
                >
                    ⛶
                </span>

                <span class="button-text">
                    FULLSCREEN
                </span>

            </button>


        </div>


    </header>


    <!-- =====================================================
         CALENDAR
    ====================================================== -->

    <main class="calendar-container">


        <!-- LOADING -->

        <div
            class="loading"
            id="loading"
        >


            <div class="loading-calendar-logo">

                <div
                    class="loading-calendar-logo-top">
                </div>


                <div class="loading-calendar-grid">

                    <div class="loading-calendar-cell"></div>

                    <div class="loading-calendar-cell"></div>

                    <div class="loading-calendar-cell"></div>

                    <div class="loading-calendar-cell"></div>

                    <div class="loading-calendar-cell"></div>

                    <div class="loading-calendar-cell"></div>

                </div>

            </div>


            <div class="loading-title">

                Loading Calendar of Activities

            </div>


            <div class="loading-text">

                Please wait...

            </div>


            <div class="spinner"></div>


        </div>


        <!-- =================================================
             MAIN CALENDAR IFRAME

             The source is used ONLY here.

             It is NOT placed inside the logo.
             It is NOT clickable through the logo.
        ================================================== -->

        <iframe
            id="calendarFrame"

            title="Calendar of Activities"

            allow="
                fullscreen;
                clipboard-write
            "

            allowfullscreen

            loading="eager">
        </iframe>


    </main>


</div>


<script>

/* =========================================================
   CALENDAR SOURCE
========================================================= */

const CALENDAR_URL =
    "https://script.google.com/macros/s/AKfycbz4aPCijq1ke_xNN1hr35SpJFVcPmoDh1p77SB4L1hhV5YWf36zHXksU3M1127-sOIc/exec?page=calendar";


/* =========================================================
   ELEMENTS
========================================================= */

const app =
    document.getElementById("app");

const calendarFrame =
    document.getElementById("calendarFrame");

const loading =
    document.getElementById("loading");

const fullscreenIcon =
    document.getElementById("fullscreenIcon");


/* =========================================================
   LOAD CALENDAR
========================================================= */

calendarFrame.src =
    CALENDAR_URL;


/* =========================================================
   CALENDAR LOADED
========================================================= */

calendarFrame.addEventListener(
    "load",
    function() {

        setTimeout(
            function() {

                loading.classList.add(
                    "hidden"
                );

            },
            400
        );

    }
);


/* =========================================================
   FULLSCREEN
========================================================= */

async function toggleFullscreen() {

    const isFullscreen =
        document.fullscreenElement ||
        document.webkitFullscreenElement;


    try {

        if (!isFullscreen) {


            if (
                app.requestFullscreen
            ) {

                await app.requestFullscreen();

            }


            else if (
                app.webkitRequestFullscreen
            ) {

                app.webkitRequestFullscreen();

            }


        }

        else {


            if (
                document.exitFullscreen
            ) {

                await document.exitFullscreen();

            }


            else if (
                document.webkitExitFullscreen
            ) {

                document.webkitExitFullscreen();

            }

        }

    }

    catch (error) {

        console.log(
            "Fullscreen error:",
            error
        );

    }

}


/* =========================================================
   UPDATE FULLSCREEN ICON
========================================================= */

function updateFullscreenIcon() {

    const isFullscreen =
        document.fullscreenElement ||
        document.webkitFullscreenElement;


    if (isFullscreen) {

        fullscreenIcon.textContent =
            "✕";

    }

    else {

        fullscreenIcon.textContent =
            "⛶";

    }

}


document.addEventListener(
    "fullscreenchange",
    updateFullscreenIcon
);


document.addEventListener(
    "webkitfullscreenchange",
    updateFullscreenIcon
);


/* =========================================================
   F11
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "F11") {

            event.preventDefault();

            toggleFullscreen();

        }

    }
);

</script>


</body>

</html>
