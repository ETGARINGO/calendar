<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <link rel="icon" type="image/png" href="NAP-PRO9.png">
    <link rel="apple-touch-icon" href="NAP-PRO9.png">
    
    <title>Calendar of Activities - Monitoring Portal</title>
    
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            font-family: 'Montserrat', sans-serif; 
            background-color: #e5e5e5; 
            -webkit-text-size-adjust: 100%;
        }
        
        .main-container { 
            height: 100vh; 
            height: 100dvh; /* Dynamic viewport height for modern mobile browsers & iOS */
            width: 100vw;
            position: relative; 
        }
        
        /* Floating Toggle Button */
        .fs-toggle {
            position: absolute;
            top: env(safe-area-inset-top, 15px);
            right: 15px;
            z-index: 100;
            cursor: pointer;
            background: rgba(26, 37, 47, 0.85);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: background 0.3s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .fs-toggle:hover { background: #e67e22; }

        .sheet-container { 
            height: 100%; 
            width: 100%; 
        }
        
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block; 
            /* Fixes iOS iframe scrolling/momentum issues */
            -webkit-overflow-scrolling: touch; 
        }
    </style>
</head>
<body>

    <div class="main-container" id="fullscreen-target">
        <button class="fs-toggle" onclick="toggleFullscreen()">⛶</button>

        <div class="sheet-container">
            <iframe 
                src="https://script.google.com/macros/s/AKfycbxNdTbO8o4RlBs_a-iPPi6jfN99vLAOZlWYBDXI80xw-lHWPOVITCzfQNOAR4Uk0AGK/exec"
                allow="fullscreen; accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <script>
        // Attempt automatic full-screen entry on first user interaction (since browsers block autoplay full-screen on load)
        function triggerAutoFullscreen() {
            const elem = document.getElementById("fullscreen-target");
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {});
                } else if (elem.webkitRequestFullscreen) { /* Safari / iOS fallback */
                    elem.webkitRequestFullscreen();
                }
            }
            // Remove listeners once interaction triggers it
            window.removeEventListener('click', triggerAutoFullscreen);
            window.removeEventListener('touchend', triggerAutoFullscreen);
        }

        window.addEventListener('click', triggerAutoFullscreen);
        window.addEventListener('touchend', triggerAutoFullscreen);

        function toggleFullscreen() {
            const elem = document.getElementById("fullscreen-target");
            const btn = document.querySelector(".fs-toggle");

            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;

            if (!isFullscreen) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => alert(`Error: ${err.message}`));
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
                btn.textContent = "⛶";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
                btn.textContent = "⛶";
            }
        }

        // Sync button label if fullscreen status changes externally (e.g. via ESC key)
        document.addEventListener("fullscreenchange", updateButtonState);
        document.addEventListener("webkitfullscreenchange", updateButtonState);

        function updateButtonState() {
            const btn = document.querySelector(".fs-toggle");
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
            if (!isFullscreen) {
                btn.textContent = "Full View";
            } else {
                btn.textContent = "Exit Full View";
            }
        }
    </script>
</body>
</html>
